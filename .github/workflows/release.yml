name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${GITHUB_REF_NAME}" -o openseries-windows-amd64.exe .
      - run: gh release create "$GITHUB_REF_NAME" openseries-windows-amd64.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
