name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p openseries
      # Same asset name as the Go v0.2 builds so their updater hands over.
      - run: copy target\release\openseries.exe openseries-windows-amd64.exe
        shell: cmd
      - run: gh release create "$env:GITHUB_REF_NAME" openseries-windows-amd64.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
